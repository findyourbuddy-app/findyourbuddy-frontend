name: Frontend CI

on:
  push:
    branches: [main, Development]
  pull_request:

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run tests
        run: npx jest --silent

      # Advisory: most findings are in Expo's transitive deps and clear with an
      # SDK bump (done manually, see AGENTS.md). Review the log; don't block on it.
      - name: Audit dependencies
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
