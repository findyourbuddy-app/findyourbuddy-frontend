version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Expo SDK bumps are handled manually with `npx expo install` -- see AGENTS.md.
      - dependency-name: "expo"
      - dependency-name: "react-native"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
